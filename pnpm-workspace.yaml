# pnpm 10+ blocks dependency lifecycle (build) scripts by default for
# supply-chain safety. This is the approval list (the pnpm 11 home for
# what used to be package.json's "pnpm.onlyBuiltDependencies"). Setting a
# package to true lets its install script run. sharp's build is required
# so Next.js image optimization gets its native binary.
allowBuilds:
  '@firebase/util': true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@15.5.26'
  - '@next/eslint-plugin-next@15.5.26'
  - '@next/swc-darwin-arm64@15.5.26'
  - '@next/swc-darwin-x64@15.5.26'
  - '@next/swc-linux-arm64-gnu@15.5.26'
  - '@next/swc-linux-arm64-musl@15.5.26'
  - '@next/swc-linux-x64-gnu@15.5.26'
  - '@next/swc-linux-x64-musl@15.5.26'
  - '@next/swc-win32-arm64-msvc@15.5.26'
  - '@next/swc-win32-x64-msvc@15.5.26'
  - eslint-config-next@15.5.26
  - next@15.5.26

# Security patch/minor bumps for transitive advisories `pnpm audit --prod`
# flags in dependency subtrees whose own package.json range already allows
# the patched version (or, where noted, a same-major bump within it).
# Scoped selectors (parent>child) are used where two different major lines
# of the same package are legitimately required by different consumers, so
# the untouched line isn't forced across a major version.
overrides:
  axios: ^1.20.0
  protobufjs: ^7.6.6
  '@protobufjs/utf8': ^1.1.2
  node-forge: ^1.4.0
  fast-uri: ^3.1.8
  websocket-driver: ^0.7.5
  js-yaml: ^4.3.2
  postcss: ^8.5.28
  nanoid: ^3.3.19
  browserslist: ^4.29.0
  baseline-browser-mapping: ^2.11.25
  fast-xml-parser: ^5.11.1
  fast-xml-builder: ^1.3.1
  hono: ^4.13.8
  '@hono/node-server': ^1.19.15
  qs: ^6.16.0
  # next's own optional sharp resolution doesn't dedupe to the root pin
  sharp: ^0.35.5
  # only shadcn's 7.x line is vulnerable; @tailwindcss/typography pins 6.0.10
  'shadcn>postcss-selector-parser': ^7.1.3
  body-parser: ^2.4.0
  # proxy-addr: express 5.2.x (via @modelcontextprotocol/sdk) resolves the vulnerable 2.0.7
  proxy-addr: ^2.0.8
  '@tootallnate/once': ^2.0.1
  '@babel/core': ^7.29.7
  ip-address: ^10.3.1
  # picomatch: keep micromatch on its 2.x line (patched), everything else on 4.x
  picomatch: ^4.0.7
  'micromatch>picomatch': ^2.3.2
  # path-to-regexp: only express/router's 8.x line is vulnerable; msw/next stay on 6.x
  'router>path-to-regexp': ^8.4.2
  # brace-expansion: patch each major line in place; eslint's 1.x line isn't vulnerable
  'minimatch@9.0.9>brace-expansion': ^2.1.7
  'minimatch@10.2.4>brace-expansion': ^5.0.9
  # @grpc/grpc-js: @firebase/firestore pins ~1.9.0 (patch only); google-gax allows ^1.10.9
  '@firebase/firestore>@grpc/grpc-js': 1.9.16
  '@grpc/grpc-js': ^1.14.5
  # form-data: @types/request wants 2.x; axios (bumped above) already requires 4.0.6+
  '@types/request>form-data': ^2.5.6
  follow-redirects: ^1.16.1
  '@fastify/busboy': ^3.2.2
  # re2js: stay on the patched 2.8.x line; 2.9.x is a fresh minor
  re2js: ~2.8.7
  source-map-js: ^1.2.2
