# Drop-in for crestahq.service, a systemd --user unit on velo-server. The
# base unit was installed by hand on the box and is not in this repo (see
# scripts/deploy-velo.sh); this file overrides just the two settings the
# default unit is missing, without anyone needing to know or reproduce the
# rest of the unit (WorkingDirectory, ExecStart, etc).
#
# Installed by scripts/deploy-velo.sh into
# ~/.config/systemd/user/crestahq.service.d/override.conf on every deploy.
#
# Without TimeoutStopSec, the user manager's default (15s) applies. Next's
# standalone server.js DOES handle SIGTERM gracefully — it calls
# server.close() and waits for in-flight/keep-alive connections to drain
# before exiting — but that can take longer than 15s under load. On
# 2026-09-22 06:33 a deploy restart hit exactly that: SIGKILL landed before
# the graceful drain finished, and cloudflared logged "connection refused"
# to 127.0.0.1:4300 during the gap. 30s (same value used for
# services/wa-manager/deploy/wa-manager.service) gives headroom without
# masking a genuinely hung process for long.
[Service]
KillSignal=SIGTERM
TimeoutStopSec=30
