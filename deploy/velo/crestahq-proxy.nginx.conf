# nginx config for crestahq-proxy.service — run unprivileged by velo with
# prefix ~/crestahq-proxy/ (every relative path below resolves there).
# scripts/deploy-velo.sh installs this file on each switch and writes
# upstream.conf beside it; never edit the installed copy by hand.
#
# The goal is to be INVISIBLE: the app must see exactly the request it saw
# when cloudflared talked to Node directly. So request headers pass through
# untouched (cloudflared's X-Forwarded-For / -Proto and CF-Connecting-IP are
# what rate limits and Twilio signature checks read), Host is preserved, and
# nothing is buffered, capped or timed out sooner than before.
daemon off;
worker_processes 2;
# systemd gives user services a 1024 soft fd limit; Node raised its own to the
# hard limit, so nginx must too or it caps concurrent connections below Node.
worker_rlimit_nofile 16384;
pid nginx.pid;
error_log stderr warn;

events {
  worker_connections 4096;
}

http {
  access_log off;
  server_tokens off;

  client_body_temp_path tmp/client_body;
  proxy_temp_path tmp/proxy;
  fastcgi_temp_path tmp/fastcgi;
  uwsgi_temp_path tmp/uwsgi;
  scgi_temp_path tmp/scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
  }

  upstream crestahq {
    # Written by scripts/deploy-velo.sh: exactly one `server 127.0.0.1:<port>;`
    include upstream.conf;
  }

  server {
    listen 127.0.0.1:4300;

    # Node accepts up to 16 KB of headers; nginx's defaults (8 KB request
    # lines/headers, 4-8 KB upstream response headers) would 400/502 on a
    # large session cookie or Set-Cookie that works today.
    large_client_header_buffers 4 32k;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    underscores_in_headers on;

    # No cap and no buffering: uploads and streamed (AI / SSE) responses go
    # straight through, as they did before the proxy existed.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
      proxy_pass http://crestahq;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_redirect off;
    }
  }

  # Check port. cloudflared only ever points at 4300, so this is reachable
  # from this box alone. scripts/deploy-velo.sh reads the header to PROVE a
  # reload switched the upstream before it drains and stops the old colour —
  # the header never appears on 4300, so the internal port is never public.
  server {
    listen 127.0.0.1:4309;
    location / {
      proxy_pass http://crestahq;
      proxy_set_header Host $http_host;
      add_header X-CrestaHQ-Upstream $upstream_addr always;
    }
  }
}
