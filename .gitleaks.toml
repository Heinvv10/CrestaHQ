# gitleaks config. Extends the default ruleset rather than replacing it.
[extend]
useDefault = true

# Allowlist DOCUMENTATION PLACEHOLDERS only.
#
# These match the literal placeholder text, so a real credential on the same
# line, in the same file, under the same rule is still caught. Deliberately not
# a `paths` exclusion and not a rule-id exclusion — silencing a whole file or a
# whole rule is how a scanner quietly stops scanning while still reporting
# green.
#
# Verified in both directions when added: with these entries the repo scans
# clean, and a planted `sk_live_...` Stripe key is still detected.
[allowlist]
description = "Documentation placeholders, not credentials"
# Anchored to the EXACT placeholder values gitleaks captures as the secret
# (allowlist regexes match the captured secret, not the surrounding line), so
# these cannot widen to match a real token that merely sits nearby.
regexes = [
  # Setup instructions in the QStash cron route's header comment.
  '''^YOUR_QSTASH_TOKEN$''',
  # Public API docs page showing buyers the Bearer format.
  '''^lsk_live_\.\.\.$''',
  # Retired wa-manager test fixture: only exists in commit 36549d2's diff
  # (services/wa-manager/config/config_test.go line 11 at that point in
  # history). Never a credential — a >=32-char OPERATOR_TOKEN test value.
  # Replaced at the tip by a low-entropy fixture; this anchor exists only
  # so the retired commit's diff stops tripping the history scan.
  '''^op-secret-0123456789abcdef012345$''',
  # GBP token-lifecycle test fixtures (src/lib/gbp/tokens.test.ts): made-up
  # refresh tokens given Google's "1//0g" prefix so the refresh/rotation paths
  # see realistic values. generic-api-key flags them by entropy. Never
  # credentials — each is an English phrase, and each anchor matches only
  # that exact value.
  # Agent API key-mint route test fixture
  # (src/app/api/sub-accounts/[id]/api-keys/route.test.ts): a made-up key in
  # the lsk_ format so the mint response shape is realistic. Never a
  # credential; the anchor matches only this exact value.
  '''^lsk_live_abc123_secret$''',
  '''^1//0gMineButStale$''',
  '''^1//0gTheirRotation$''',
  '''^1//0gNewerGrant$''',
  '''^1//0gThirdGrant$''',
  '''^1//0gOurRotation$''',
  # Calendar-feed route test fixture: only exists in commit 6fb9615's diff
  # (src/app/api/sub-accounts/[id]/calendar.ics/route.test.ts line 12 at that
  # point in history), as the HMAC secret the test signs its own feed token
  # with. Never a credential. Replaced at the tip by a low-entropy fixture;
  # this anchor exists only so that commit's diff stops tripping the scan.
  '''^ics-route-test-secret-0123456789$''',
  # Rules-test fixture: only exists in commit 592a3ed0's diff
  # (src/lib/paystack/payments.firestore-rules.test.ts line 134 at that point
  # in history) as a paymentAttempts `keyFingerprint` value. Never a
  # credential — a hex counting sequence. Replaced at the tip by a
  # low-entropy fixture; this anchor exists only so that commit's diff stops
  # tripping the history scan.
  '''^0123456789abcdef01234567$''',
  # ApexGEO connection test fixture: only exists in commit d9f45ce7's diff
  # (src/components/settings/sub-account-apexgeo-section.test.ts line 15 and
  # src/app/api/sub-accounts/[id]/apexgeo-connection/route.test.ts line 19 at
  # that point in history) as a made-up apx_ key. Never a credential.
  # Replaced at the tip by a low-entropy fixture; this anchor exists only so
  # that commit's diff stops tripping the history scan.
  '''^apx_live_abcdef123456$''',
]
