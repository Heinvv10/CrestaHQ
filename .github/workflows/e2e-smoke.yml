name: E2E smoke (production)

# The same specs, aimed at the deployed app instead of a PR build. This one
# does NOT gate anything: crm.crestahq.com serves whatever was last deployed,
# so a red run here means "production is unhappy", not "this change is bad".
# The blocking Playwright job lives in ci.yml and tests the PR's own build.
#
# Specs tagged @enrols-workflows (form-submit, workflow-enrol,
# appointment-status, pipelines) are excluded below: against a PR's own
# build they enrol a FIXTURE workflow that publishes to a CI-only QStash
# project, but against production the app runs with production's own
# QStash token, so the same enrolment publishes a REAL scheduled step —
# on 14-16 Sep 2026 that put ~307 real QStash steps through this account's
# 1,000/day limit and silently dropped real scheduled work once it ran out.
# workflow-enrol was previously expected to fail here (a signed step call
# 401s against a deployment); it is now excluded instead of run-and-ignored.
#
# Dispatched by scripts/deploy-velo.sh once a deploy is live, pinned to the
# deployed commit. It no longer runs on push: production only takes main at
# the next deploy, so a push run tested main's specs against an older
# release and failed on features that were not live yet.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit production is serving (blank = branch head; after a rollback, give the release's commit)
        required: false

jobs:
  smoke:
    name: Playwright vs crm.crestahq.com
    # Same fixture sub-accounts as the ci.yml E2E job, so the Playwright step
    # runs under the same fixture lock (scripts/ci/fixture-lock.mjs; see the
    # note on ci.yml's e2e job for why this is not a concurrency group).
    runs-on: ubuntu-latest
    # Lock ref write + holder-run check (see ci.yml's e2e job for the
    # accepted risk); the token is given only to the lock steps.
    permissions:
      contents: write
      actions: read
    # Includes waiting for the lock behind PR E2E runs; the steps carry the
    # real limits.
    timeout-minutes: 355
    env:
      # No build step: the target is already running. Only the values the
      # SUITE itself reads are needed — Firebase REST sign-in, the Admin SDK
      # (+ its Storage bucket),
      # the fixture ids, and the QStash key the enrol spec signs with.
      PLAYWRIGHT_BASE_URL: https://crm.crestahq.com
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
      QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.E2E_QSTASH_CURRENT_SIGNING_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      E2E_SUBACCOUNT_ID: ${{ secrets.E2E_SUBACCOUNT_ID }}
      E2E_SUBACCOUNT_ID_SECONDARY: ${{ secrets.E2E_SUBACCOUNT_ID_SECONDARY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # --with-deps: a fresh hosted runner lacks Chromium's shared libraries.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Acquire fixture lock
        timeout-minutes: 290
        run: node scripts/ci/fixture-lock.mjs acquire
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Playwright
        timeout-minutes: 45
        # @not-on-prod: specs that write test records (mystery shops) the production app would act on.
        run: pnpm exec playwright test --grep-invert "@enrols-workflows|@not-on-prod"

      - name: Release fixture lock
        if: always()
        run: node scripts/ci/fixture-lock.mjs release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # See the same step in ci.yml: error-context.md records input VALUES
      # (including E2E_PASSWORD) regardless of the spec's own trace/screenshot
      # settings, and the html reporter embeds it into playwright-report/.
      # GitHub masks a registered secret in the Actions log only, never in an
      # uploaded artifact. The upload step is gated on this step's outcome
      # being 'success' (not just "didn't fail") so a skipped or cancelled
      # redact also blocks the upload — E2E_PASSWORD is already in this job's
      # env block above.
      - name: Redact E2E password from report
        id: redact
        if: always()
        run: node scripts/ci/redact-secret-artifacts.mjs playwright-report test-results

      - name: Upload report
        if: ${{ always() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 7
