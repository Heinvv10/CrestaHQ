name: CI

# Runs on every PR, and on push to main as a backstop for anything that
# reaches main another way.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

jobs:
  # A draft transition must still enter each PR concurrency group:
  # the ordinary jobs skip drafts, so without these no new job would arrive to
  # cancel work for a PR that is no longer reviewable. These tiny helper jobs
  # run only for that transition. The E2E helper replaces pending work but,
  # unlike the fast helpers, never interrupts an active browser teardown.
  cancel_ci_on_draft:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'converted_to_draft' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ci-fast-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - run: echo "cancelled superseded fast CI for draft PR"

  cancel_secrets_on_draft:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'converted_to_draft' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ci-secrets-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - run: echo "cancelled superseded secret scan for draft PR"

  # A concurrency group cancels pending work whatever runner it was queued
  # for, so this displaces a pending E2E job. Same-repo guard: a fork PR's
  # draft event never enters the E2E group.
  replace_pending_e2e_on_draft:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'converted_to_draft' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    concurrency:
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - run: echo "replaced pending E2E for draft PR after active teardown"

  # ONE job, deliberately.
  #
  # The whole gate runs in ~52s locally (lint 9s, typecheck 4s, tests 1s,
  # build 38s), so there is nothing to gain by splitting it across jobs and
  # nothing to gain by making any step advisory to keep the pipeline quick.
  # Every step below BLOCKS. Nothing here is `continue-on-error`.
  #
  # That last point is load-bearing. In FibreFlow the unit-test step was
  # `continue-on-error: true` and a deadlocked suite reported green for
  # months — "it had never once produced a real result." A gate believed to
  # run and not running is worse than no gate, because it buys false
  # confidence. If a step here is too slow or too flaky to block, delete it
  # rather than softening it.
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-fast-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Skips a fork's PR. Be clear about what this does and does not buy:
    # `pull_request` evaluates the workflow file from the PR's OWN head, so a
    # PR can rewrite or delete this line, and the rewritten version is what
    # runs. It stops accidental fork execution; it is not a defence against a
    # deliberately crafted PR.
    #
    # The real control is that this repo is private and single-author, so
    # opening a PR at all requires access its owner controls. Residual risk
    # accepted on that basis. If a collaborator is ever added, this needs
    # revisiting — same-repo PR code runs here with the repo's secrets.
    # Draft PRs are still changing rapidly. Run the full gate once they are
    # marked ready, and on every later update, instead of spending runner time
    # on work the author has explicitly said is not reviewable yet.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      # SHA-pinned, not tag-pinned. A floating tag is mutable, and an action
      # runs with this job's secrets in reach — anything fetched at run time,
      # first-party or not, is pinned to an immutable ref.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Version comes from package.json `packageManager`. Must precede
      # setup-node, whose `cache: pnpm` shells out to pnpm.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Pinned to .nvmrc so CI and a developer's shell cannot disagree about
      # the runtime. The runner image's system node is not necessarily 22.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm lint` is the tenancy check (scripts/check-capability-tenancy.mjs)
      # followed by ESLint. The warning cap lives in package.json, NOT here —
      # one number, one place. FibreFlow ended up with the same baseline in
      # five files, drifted apart, and the CI copy was so loose the gate could
      # not fail; they now run a gate whose only job is guarding that gate.
      # The way to not need that is to never write the number twice.
      - name: Lint + tenancy check
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # The mystery shop's form-engine tests drive playwright-core's real
      # Chromium (src/lib/prospecting/mystery-shop/form/*.test.ts). A no-op
      # when the runner's cache already has this revision. Without it those
      # tests FAIL under CI (they only skip on a developer box without it).
      # --with-deps: a fresh GitHub-hosted runner lacks Chromium's shared
      # libraries; it has passwordless sudo for the apt step.
      - name: Install Chromium (form-engine tests)
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Tests
        run: pnpm test

      # The form engine's container runner, bundled as the image ships it, must
      # answer an invalid job with one well-formed result line. (CI has no
      # docker: the bundle runs on the runner's own node.)
      - name: Form engine runner smoke
        run: node scripts/form-engine-image.mjs --bundle-only && node scripts/form-engine-smoke.mjs local

      # Evaluates the repo's firestore.rules through the Firebase Rules test
      # API — nothing is deployed, no data is read. The Admin credential is
      # scoped to this step only, so no unit test above can reach production
      # Firestore with it. The spec fails, rather than skips, when CI is set
      # and the credential is missing.
      - name: Firestore rules tests
        run: pnpm test:rules
        env:
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}

      # A real build. Typecheck alone misses build-time-only failures —
      # route-type validation, server/client boundary violations, bad imports
      # in a page that tsc is happy with.
      - name: Build
        run: pnpm build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-secrets-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      # SHA-pinned, not tag-pinned (see the ci job above).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: a secret committed earlier and reverted is still in
          # the objects, and still needs rotating.
          fetch-depth: 0

      # Uses a pinned gitleaks release binary, NOT gitleaks/gitleaks-action.
      #
      # The action downloads a release tarball through /tmp/gitleaks.tmp and
      # failed with "Destination file path already exists" on the old
      # self-hosted box, where /tmp was shared between repos' runners. The
      # binary below is fetched from the release page, checked against a
      # SHA-256 pinned in this file (it matches the release's own
      # checksums.txt) and run directly. 8.24.3 is the version this gate ran
      # on the self-hosted runner, so findings do not shift with the move;
      # bump version and hash together.
      #
      # This repo holds Firebase admin keys, Stripe secrets, Twilio auth
      # tokens, a Meta app secret and WhatsApp WABA tokens. FibreFlow carried
      # a documented-but-false claim that its scanner ran in CI, and found out
      # via a real credential leak (issue #1830) plus a 26-credential audit.
      # Cheap gate, expensive absence.
      #
      # `-v` and `--log-opts` are both here because of issue #33, where this
      # gate reported "leaks found: 6" and then, re-run on the same SHA with
      # nothing changed, reported none.
      #
      # `-v` prints the rule, file, line, commit and author of every finding.
      # Without it a failure prints the single word "6" — no rule, no file, no
      # commit — which is close to unactionable, and pushes whoever hits it
      # toward re-running until green. That is exactly the wrong response to a
      # possible real leak, and exactly what happened. `--redact` still applies
      # with `-v`: the finding lines read `Secret: REDACTED`.
      #
      # `--log-opts` replaces gitleaks' default `--full-history --all`. `--all`
      # scans every ref that happens to exist in the clone, so what this gate
      # examines depends on the state of a reused runner workspace rather than
      # on the commit under test — a PR could fail on a secret sitting in an
      # unrelated branch, and the same command run locally would not reproduce
      # it. Pinning to HEAD scans exactly the commit CI built, plus all of its
      # own history, and nothing else.
      #
      # Be clear about what this narrowing COSTS, because a security gate that
      # quietly covers less than its comment claims is the failure mode this
      # file exists to avoid. Measured on a synthetic repo, `--all` found 3
      # planted keys where HEAD found 1. What stops being scanned: branches
      # that are never PR'd, tags off HEAD's ancestry, and any other stale ref
      # (`refs/notes/*`, leftovers in a reused workspace). A credential pushed
      # to a branch nobody opens a PR for is now invisible to CI, and still
      # needs rotating.
      #
      # Accepted, because nothing reaches main unscanned: HEAD on a PR is the
      # merge ref, and `git log -p` walks BOTH parents, so the PR's own commits
      # are included; HEAD on a push is main itself. Every commit that lands on
      # main is scanned with its full history behind it.
      #
      # This does NOT explain the flake and #33 stays open. The obvious
      # hypothesis — `--all` picked up a leaky branch that was deleted between
      # the two runs — was tested and does not hold: the only closed-unmerged
      # branch in this repo (`tmp/mutation-proof-enrol`, PR #28) scans clean,
      # and both runs reported the same 187 commits, which an extra branch
      # would have raised. What this buys is that the next occurrence is
      # reproducible: the printed SHA plus the command below is the whole input.
      - name: gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          GITLEAKS_SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          GITLEAKS_DIR="$RUNNER_TEMP/gitleaks"
          mkdir -p "$GITLEAKS_DIR"
          curl -sSfL --retry 3 -o "$GITLEAKS_DIR/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $GITLEAKS_DIR/gitleaks.tgz" | sha256sum -c -
          tar -C "$GITLEAKS_DIR" -xzf "$GITLEAKS_DIR/gitleaks.tgz" gitleaks
          export PATH="$GITLEAKS_DIR:$PATH"
          gitleaks version
          git --version
          echo "scanning HEAD=$(git rev-parse HEAD)"
          # `--redact` and `-v` travel together. Do not drop `--redact` while
          # `-v` is here: verbose output would print live credentials into
          # Actions logs, which persist and are readable by anyone with repo
          # read access.
          gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 \
            -v --log-opts="--full-history HEAD" .

  # Playwright, against THIS PR's build.
  #
  # The suite starts `pnpm start` on 127.0.0.1:3100 (playwright.config.ts) and
  # drives that. Pointing it at crm.crestahq.com instead would test whatever
  # main last deployed — green would prove nothing about the change under
  # review, and an unrelated production blip would block the PR. See
  # docs/parity/sp0.md for the full reasoning.
  #
  # Blocking, like every other step in this file. NOT continue-on-error. If it
  # ever becomes too flaky to block, delete it rather than soften it.
  #
  # GitHub-hosted: each job gets its own VM, so port 3100 is never shared.
  # The fixture sub-accounts in the production Firestore still ARE shared —
  # every run seeds them and e2e/global-setup.ts purges them — so the E2E job
  # runs under scripts/ci/fixture-lock.mjs, a cross-run mutex held as a git
  # ref (refs/ci-locks/e2e-fixtures). e2e-smoke.yml takes the same lock. It
  # WAITS for the holder instead of cancelling anything, and a crashed holder
  # (run completed without releasing, or held > 150 min) is taken over, so it
  # cannot wedge the queue. Waiting is polled, not FIFO.
  #
  # The lock lives in its own jobs (e2e-lock, e2e-unlock) because writing the
  # ref needs `contents: write`, and the E2E job runs the PR's code, its
  # dependencies and the suite. Those two jobs check out the repo and run the
  # lock script with node built-ins only: no install, no secrets, no app code.
  # The E2E job itself gets a read-only token.
  #
  # Not a concurrency group across PRs: GitHub keeps one pending run per
  # group and cancels the rest, which would cancel other PRs' required check.
  # The lock job's concurrency group is per ref: it coalesces superseded
  # pending heads of ONE PR. The E2E job is in no group, so nothing cancels an
  # active browser run — cancellation before `finally` strands shared
  # Firestore fixtures and makes later, unrelated runs fail. A lock job starts
  # at once and waits inside the acquire step, where the group cannot replace
  # it, so the acquire step itself gives up (failing that superseded commit's
  # check) once the PR has a newer head or is closed.
  e2e-lock:
    name: E2E fixture lock
    # Do not spend ~11 minutes exercising a revision that already failed a
    # faster blocking gate. The fixture runner remains serialised exactly as
    # before; this only changes when it enters that queue.
    needs: [ci, secrets]
    runs-on: ubuntu-latest
    # contents: write creates the lock ref; actions: read checks whether a
    # lock holder's run is still alive; pull-requests: read sees a newer head.
    # The lock script itself comes from the default branch (below). A
    # same-repo PR can still edit this workflow file; that is not a boundary
    # against the PR's author (who already has write access; fork PRs never
    # run this job).
    permissions:
      contents: write
      actions: read
      pull-requests: read
    concurrency:
      group: ci-e2e-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: false
    # The wait is the step's 220 min; a wait that runs out means ~4 runs were
    # queued ahead, and fails the E2E check.
    timeout-minutes: 230
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      # This job holds contents: write, so it runs the lock script from the
      # default branch, never this commit's copy (node built-ins only: no
      # install, no app code). Everything the lock needs from the run (PR
      # number, head sha, run id) comes from env, not from the checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Acquire fixture lock
        timeout-minutes: 220
        run: node scripts/ci/fixture-lock.mjs acquire
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOCK_PR_NUMBER: ${{ github.event.pull_request.number }}
          LOCK_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  e2e:
    name: E2E (Playwright)
    needs: [e2e-lock]
    runs-on: ubuntu-latest
    # Read-only: the held-lock check below only reads the ref.
    permissions:
      contents: read
    # The lock is held for this whole job, so its budget bounds how long a
    # live holder holds it (a live holder is never taken over by age).
    # Setup (~15 min) + the Playwright step's 90 + margin. On a hosted runner
    # the 186 specs take ~55-60 min (18 min on velo-server; the
    # Firestore-heavy specs are 2-4x slower).
    timeout-minutes: 120
    # always(), not success() or !cancelled(): this is the required check, and
    # a SKIPPED required check counts as passing. When e2e-lock fails, is
    # skipped (ci or secrets failed), times out or is cancelled, this job still
    # runs and its first step fails it.
    if: ${{ always() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)) }}
    env:
      # The build bakes NEXT_PUBLIC_* in, so they must be present at build
      # time, not just at runtime — hence job-level env rather than step-level.
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
      COOKIE_SECRET_CURRENT: ${{ secrets.COOKIE_SECRET_CURRENT }}
      COOKIE_SECRET_PREVIOUS: ${{ secrets.COOKIE_SECRET_PREVIOUS }}
      # E2E_QSTASH_* are CI-ONLY values, not Upstash credentials. The app and
      # the enrol spec sign/verify with the same string, so no Upstash round
      # trip is involved. They are named apart from the production secrets so a
      # future deploy or cron job reading secrets.QSTASH_TOKEN cannot silently
      # pick up a dead token and look like an Upstash outage.
      QSTASH_TOKEN: ${{ secrets.E2E_QSTASH_TOKEN }}
      QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.E2E_QSTASH_CURRENT_SIGNING_KEY }}
      QSTASH_NEXT_SIGNING_KEY: ${{ secrets.E2E_QSTASH_NEXT_SIGNING_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      E2E_SUBACCOUNT_ID: ${{ secrets.E2E_SUBACCOUNT_ID }}
      E2E_SUBACCOUNT_ID_SECONDARY: ${{ secrets.E2E_SUBACCOUNT_ID_SECONDARY }}
      # Google Business Profile runs against the deterministic FAKE provider.
      # src/lib/gbp/provider/select.ts refuses it unless the app URL is
      # loopback, the production build opts in with exactly "1", and the
      # sub-account belongs to GBP_FAKE_AGENCY_ID — this Firestore is the
      # production one, so the fake is fenced to the fixture agency.
      GBP_PROVIDER: fake
      GBP_FAKE_ALLOW_PROD_BUILD: "1"
      GBP_FAKE_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      # The WhatsApp settings fake (SP15) is fenced exactly the same way and
      # serves only the fixture agency; the deploy guard refuses these too.
      WHATSAPP_SETTINGS_PROVIDER: fake
      WHATSAPP_FAKE_ALLOW_PROD_BUILD: "1"
      WHATSAPP_FAKE_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      # The SMS fake (SP2 missed-call E2E) swaps Twilio at the ONE seam
      # sendSmsForSubAccount uses to place a send — fenced exactly the same
      # way (src/lib/comms/sms/mode.ts); the deploy guard refuses these too.
      SMS_PROVIDER: fake
      SMS_FAKE_ALLOW_PROD_BUILD: "1"
      SMS_FAKE_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      # The Google Calendar fake (SP3 PR d) — each member's "Google calendar"
      # is a Firestore doc the specs seed and read — fenced exactly the same
      # way (src/lib/google-calendar/provider/mode.ts); the deploy guard
      # refuses these too.
      GCAL_PROVIDER: fake
      GCAL_FAKE_ALLOW_PROD_BUILD: "1"
      GCAL_FAKE_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      # The Reviews AI fake (SP5 PR b) — deterministic sentiment labels, every
      # call logged (ids + count) at private/reviewsAiFakeLog so a spec can
      # count billing — fenced exactly the same way
      # (src/lib/reputation/ai/mode.ts); the deploy guard refuses these too.
      REVIEWS_AI_PROVIDER: fake
      REVIEWS_AI_FAKE_ALLOW_PROD_BUILD: "1"
      REVIEWS_AI_FAKE_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      # Review auto-reply's kill switch (gbp-auto-reply.spec.ts). E2E job ONLY.
      # Fenced like the fakes: with the GBP or Reviews AI fake the engine
      # serves only that fake's fixture agency (run.ts refuses any other after
      # reading only its sub-account doc for the agencyId, before any write),
      # it runs only after a sync the fenced GBP fake allowed, drafts only
      # through the fenced Reviews AI fake and posts only through the fenced
      # GBP fake — so no real tenant's reviews are read, drafted or posted for.
      REVIEWS_AUTO_REPLY_ENABLED: "1"
      # The whole suite runs from one loopback client, so the public booking
      # routes' per-IP rate limiters (src/lib/booking/rate-limit-e2e.ts) would
      # otherwise 429 partway through. Fenced the same way (loopback app URL
      # required); the deploy guard refuses this name too.
      E2E_DISABLE_BOOKING_RATE_LIMITS: "1"
      # The GBP sync cron does nothing unless the schedule is enabled; the E2E
      # specs drive it with a signed POST. (Registering the schedule itself
      # fails harmlessly: the E2E QStash values are not Upstash credentials.)
      GBP_SYNC_SCHEDULE_ENABLED: "1"
      # Signs the OAuth `state`. Per-run, not a stored secret: nothing outlives
      # the job that signs and verifies it.
      AUTOMATIONS_TOKEN_SECRET: e2e-state-${{ github.run_id }}-${{ github.run_attempt }}
      # The gitpage build-settled callback (website-build-settled.spec.ts) is
      # verified with an HMAC under GITPAGE_API_KEY; the spec signs with the
      # same string. That key is NOT set here: the "Generate the gitpage
      # callback key" step below draws it at random for each run. It is not a
      # gitpage credential. Nothing in the suite calls gitpage, and
      # GITPAGE_API_URL points at a closed loopback port so a stray call fails
      # on this box instead of presenting that string to gitpage.site — a 401
      # from there would flip system/gitpageStatus in the production Firestore
      # this job shares. (The boot heartbeat is already skipped on a loopback
      # app URL: instrumentation.ts.)
      GITPAGE_API_URL: http://127.0.0.1:9
    steps:
      - name: Require the fixture lock job
        if: ${{ needs.e2e-lock.result != 'success' }}
        run: |
          echo "E2E fixture lock job result: ${{ needs.e2e-lock.result }}; not running E2E" >&2
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # A "re-run failed jobs" reruns this job but not e2e-lock, whose lock the
      # first attempt's e2e-unlock already released: refuse to run unlocked.
      - name: Check this run attempt holds the fixture lock
        run: node scripts/ci/fixture-lock.mjs held
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Same pnpm + node setup as the `ci` job (version from package.json
      # `packageManager`; must precede setup-node's `cache: pnpm`).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # --with-deps: a fresh GitHub-hosted runner lacks Chromium's shared
      # libraries; it has passwordless sudo for the apt step.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # Random per run, never derived from the run id: the app this job boots
      # listens on a shared multi-user box and writes to the production
      # Firestore, so a key another local process could guess would let it
      # forge a build-settled callback while the run is up. Masked in the log
      # and exported for the steps below, so the server Playwright starts and
      # the spec that signs both read the same value.
      - name: Generate the gitpage callback key
        run: |
          KEY="gp_e2e_$(openssl rand -hex 32)"
          [ "${#KEY}" -eq 71 ] || { echo "gitpage callback key was not generated" >&2; exit 1; }
          echo "::add-mask::$KEY"
          echo "GITPAGE_API_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Playwright
        timeout-minutes: 90
        run: pnpm exec playwright test

      # login.spec.ts opts its own trace/screenshot off, but Playwright still
      # writes an error-context.md aria snapshot on failure, and that snapshot
      # records input VALUES — including whatever E2E_PASSWORD the spec typed
      # into the password field. The html reporter embeds it into
      # playwright-report/, which the next step uploads as an artifact; GitHub
      # only masks a registered secret in the Actions LOG, never in an
      # uploaded artifact. Redact before every upload. The upload step below
      # is gated on `steps.redact.outcome == 'success'` (not `!= 'failure'`),
      # so a skipped or cancelled redact also blocks the upload — a fail-open
      # `if: always()` on the upload would make the script's exit 1 cosmetic.
      # E2E_PASSWORD is already in this job's env block above; no need to
      # redeclare it here.
      - name: Redact E2E password from report
        id: redact
        if: always()
        run: node scripts/ci/redact-secret-artifacts.mjs playwright-report test-results

      - name: Upload report
        if: ${{ always() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # always(): runs after a failure, timeout or cancellation of either job too.
  # Frees the lock (compare-and-swap) only if its recorded holder is this run
  # attempt; a no-op otherwise. Skipped only when e2e-lock was (draft, fork, failed gate), in
  # which case this run never touched the lock.
  e2e-unlock:
    name: E2E fixture unlock
    needs: [e2e-lock, e2e]
    if: ${{ always() && needs.e2e-lock.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      # This job holds contents: write, so it runs the lock script from the
      # default branch, never this commit's copy (node built-ins only: no
      # install, no app code). Everything the lock needs from the run (PR
      # number, head sha, run id) comes from env, not from the checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Release fixture lock
        run: node scripts/ci/fixture-lock.mjs release
        env:
          GITHUB_TOKEN: ${{ github.token }}
