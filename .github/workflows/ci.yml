name: CI

# Runs on every PR, and on push to main as a backstop for anything that
# reaches main another way.
on:
  pull_request:
  push:
    branches: [main]

# A superseded PR run is worthless — cancel it. Main runs are never cancelled:
# they are the record of what actually landed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ONE job, deliberately.
  #
  # The whole gate runs in ~52s locally (lint 9s, typecheck 4s, tests 1s,
  # build 38s), so there is nothing to gain by splitting it across jobs and
  # nothing to gain by making any step advisory to keep the pipeline quick.
  # Every step below BLOCKS. Nothing here is `continue-on-error`.
  #
  # That last point is load-bearing. In FibreFlow the unit-test step was
  # `continue-on-error: true` and a deadlocked suite reported green for
  # months — "it had never once produced a real result." A gate believed to
  # run and not running is worse than no gate, because it buys false
  # confidence. If a step here is too slow or too flaky to block, delete it
  # rather than softening it.
  ci:
    name: Lint, typecheck, test, build
    runs-on: [self-hosted, linux, velo, crestahq]
    timeout-minutes: 20
    # Skips a fork's PR. Be clear about what this does and does not buy:
    # `pull_request` evaluates the workflow file from the PR's OWN head, so a
    # PR can rewrite or delete this line, and the rewritten version is what
    # runs. It stops accidental fork execution; it is not a defence against a
    # deliberately crafted PR.
    #
    # The real control is that this repo is private and single-author, so
    # opening a PR at all requires access this machine's owner controls.
    # Residual risk accepted on that basis. If a collaborator is ever added,
    # this needs revisiting — self-hosted runners execute PR code on a
    # workstation that also hosts four other repos' runners.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # SHA-pinned, not tag-pinned. A floating tag is mutable, and on a
      # self-hosted runner an action runs with this machine's filesystem in
      # reach — the same reasoning that made the gitleaks download not worth
      # it applies to anything else fetched at run time, first-party or not.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pinned to .nvmrc so CI and a developer's shell cannot disagree about
      # the runtime. The box's system node is v20; this project needs 22.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm lint` is the tenancy check (scripts/check-capability-tenancy.mjs)
      # followed by ESLint. The warning cap lives in package.json, NOT here —
      # one number, one place. FibreFlow ended up with the same baseline in
      # five files, drifted apart, and the CI copy was so loose the gate could
      # not fail; they now run a gate whose only job is guarding that gate.
      # The way to not need that is to never write the number twice.
      - name: Lint + tenancy check
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm test

      # Evaluates the repo's firestore.rules through the Firebase Rules test
      # API — nothing is deployed, no data is read. The Admin credential is
      # scoped to this step only, so no unit test above can reach production
      # Firestore with it. The spec fails, rather than skips, when CI is set
      # and the credential is missing.
      - name: Firestore rules tests
        run: pnpm test:rules
        env:
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}

      # A real build. Typecheck alone misses build-time-only failures —
      # route-type validation, server/client boundary violations, bad imports
      # in a page that tsc is happy with.
      - name: Build
        run: pnpm build

  secrets:
    name: Secret scan
    runs-on: [self-hosted, linux, velo, crestahq]
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # SHA-pinned, not tag-pinned. A floating tag is mutable, and on a
      # self-hosted runner an action runs with this machine's filesystem in
      # reach — the same reasoning that made the gitleaks download not worth
      # it applies to anything else fetched at run time, first-party or not.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: a secret committed earlier and reverted is still in
          # the objects, and still needs rotating.
          fetch-depth: 0

      # Uses the gitleaks binary installed on the runner host, NOT
      # gitleaks/gitleaks-action.
      #
      # The action downloads a release tarball through /tmp/gitleaks.tmp. On
      # this box several repos' runners share /tmp under the sticky bit, so
      # that path is owned by whichever runner user got there first — and no
      # other runner user can delete it. ApexGEO hit this and cleans the file
      # up in a pre-step, which works only because it owns it. From here the
      # cleanup silently no-ops and the download then fails with
      # "Destination file path already exists", which reads like a scan
      # failure but is a collision with an unrelated repo's CI.
      #
      # Invoking the installed binary removes the download, the shared path
      # and the cross-repo coupling in one go, and is faster.
      #
      # This repo holds Firebase admin keys, Stripe secrets, Twilio auth
      # tokens, a Meta app secret and WhatsApp WABA tokens. FibreFlow carried
      # a documented-but-false claim that its scanner ran in CI, and found out
      # via a real credential leak (issue #1830) plus a 26-credential audit.
      # Cheap gate, expensive absence.
      #
      # `-v` and `--log-opts` are both here because of issue #33, where this
      # gate reported "leaks found: 6" and then, re-run on the same SHA with
      # nothing changed, reported none.
      #
      # `-v` prints the rule, file, line, commit and author of every finding.
      # Without it a failure prints the single word "6" — no rule, no file, no
      # commit — which is close to unactionable, and pushes whoever hits it
      # toward re-running until green. That is exactly the wrong response to a
      # possible real leak, and exactly what happened. `--redact` still applies
      # with `-v`: the finding lines read `Secret: REDACTED`.
      #
      # `--log-opts` replaces gitleaks' default `--full-history --all`. `--all`
      # scans every ref that happens to exist in the clone, so what this gate
      # examines depends on the state of a reused runner workspace rather than
      # on the commit under test — a PR could fail on a secret sitting in an
      # unrelated branch, and the same command run locally would not reproduce
      # it. Pinning to HEAD scans exactly the commit CI built, plus all of its
      # own history, and nothing else.
      #
      # Be clear about what this narrowing COSTS, because a security gate that
      # quietly covers less than its comment claims is the failure mode this
      # file exists to avoid. Measured on a synthetic repo, `--all` found 3
      # planted keys where HEAD found 1. What stops being scanned: branches
      # that are never PR'd, tags off HEAD's ancestry, and any other stale ref
      # (`refs/notes/*`, leftovers in a reused workspace). A credential pushed
      # to a branch nobody opens a PR for is now invisible to CI, and still
      # needs rotating.
      #
      # Accepted, because nothing reaches main unscanned: HEAD on a PR is the
      # merge ref, and `git log -p` walks BOTH parents, so the PR's own commits
      # are included; HEAD on a push is main itself. Every commit that lands on
      # main is scanned with its full history behind it.
      #
      # This does NOT explain the flake and #33 stays open. The obvious
      # hypothesis — `--all` picked up a leaky branch that was deleted between
      # the two runs — was tested and does not hold: the only closed-unmerged
      # branch in this repo (`tmp/mutation-proof-enrol`, PR #28) scans clean,
      # and both runs reported the same 187 commits, which an extra branch
      # would have raised. What this buys is that the next occurrence is
      # reproducible: the printed SHA plus the command below is the whole input.
      - name: gitleaks
        run: |
          command -v gitleaks >/dev/null || {
            echo "::error::gitleaks is not installed on this runner host."
            echo "Install it once: curl -sSL <release>.tar.gz | sudo tar -C /usr/local/bin -xz gitleaks"
            exit 1
          }
          gitleaks version
          git --version
          echo "scanning HEAD=$(git rev-parse HEAD)"
          # `--redact` and `-v` travel together. Do not drop `--redact` while
          # `-v` is here: verbose output would print live credentials into
          # Actions logs, which persist and are readable by anyone with repo
          # read access.
          gitleaks git --redact --no-banner --config .gitleaks.toml --exit-code 1 \
            -v --log-opts="--full-history HEAD" .

  # Playwright, against THIS PR's build.
  #
  # The suite starts `pnpm start` on 127.0.0.1:3100 (playwright.config.ts) and
  # drives that. Pointing it at crm.crestahq.com instead would test whatever
  # main last deployed — green would prove nothing about the change under
  # review, and an unrelated production blip would block the PR. See
  # docs/parity/sp0.md for the full reasoning.
  #
  # Blocking, like every other step in this file. NOT continue-on-error. If it
  # ever becomes too flaky to block, delete it rather than soften it.
  #
  # Pinned to the one runner labelled crestahq-e2e. Every run binds
  # 127.0.0.1:3100 and seeds + purges the same fixture sub-accounts, so two
  # E2E jobs on two runners would collide on both. The other jobs share no
  # port or tenant; they do share the runner user's pnpm store and Go caches,
  # which both tools lock for concurrent use.
  #
  # e2e-smoke.yml's "smoke" job runs on the SAME runner label for the same
  # reason (same fixture tenants, same port 3100). The single labelled runner
  # is what serialises the two. Do NOT add a shared `concurrency:` group for
  # this: GitHub keeps at most one pending job per group and cancels the
  # older pending one, so every PR's E2E but the newest would be cancelled.
  e2e:
    name: E2E (Playwright)
    runs-on: [self-hosted, linux, velo, crestahq, crestahq-e2e]
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      # The build bakes NEXT_PUBLIC_* in, so they must be present at build
      # time, not just at runtime — hence job-level env rather than step-level.
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
      FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
      FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
      COOKIE_SECRET_CURRENT: ${{ secrets.COOKIE_SECRET_CURRENT }}
      COOKIE_SECRET_PREVIOUS: ${{ secrets.COOKIE_SECRET_PREVIOUS }}
      # E2E_QSTASH_* are CI-ONLY values, not Upstash credentials. The app and
      # the enrol spec sign/verify with the same string, so no Upstash round
      # trip is involved. They are named apart from the production secrets so a
      # future deploy or cron job reading secrets.QSTASH_TOKEN cannot silently
      # pick up a dead token and look like an Upstash outage.
      QSTASH_TOKEN: ${{ secrets.E2E_QSTASH_TOKEN }}
      QSTASH_CURRENT_SIGNING_KEY: ${{ secrets.E2E_QSTASH_CURRENT_SIGNING_KEY }}
      QSTASH_NEXT_SIGNING_KEY: ${{ secrets.E2E_QSTASH_NEXT_SIGNING_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      E2E_SUBACCOUNT_ID: ${{ secrets.E2E_SUBACCOUNT_ID }}
      E2E_SUBACCOUNT_ID_SECONDARY: ${{ secrets.E2E_SUBACCOUNT_ID_SECONDARY }}
      # Google Business Profile runs against the deterministic FAKE provider.
      # src/lib/gbp/provider/select.ts refuses it unless the app URL is
      # loopback, the production build opts in with exactly "1", and the
      # sub-account belongs to GBP_FAKE_AGENCY_ID — this Firestore is the
      # production one, so the fake is fenced to the fixture agency.
      GBP_PROVIDER: fake
      GBP_FAKE_ALLOW_PROD_BUILD: "1"
      GBP_FAKE_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      # The WhatsApp settings fake (SP15) is fenced exactly the same way and
      # serves only the fixture agency; the deploy guard refuses these too.
      WHATSAPP_SETTINGS_PROVIDER: fake
      WHATSAPP_FAKE_ALLOW_PROD_BUILD: "1"
      WHATSAPP_FAKE_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      # The SMS fake (SP2 missed-call E2E) swaps Twilio at the ONE seam
      # sendSmsForSubAccount uses to place a send — fenced exactly the same
      # way (src/lib/comms/sms/mode.ts); the deploy guard refuses these too.
      SMS_PROVIDER: fake
      SMS_FAKE_ALLOW_PROD_BUILD: "1"
      SMS_FAKE_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      # The Google Calendar fake (SP3 PR d) — each member's "Google calendar"
      # is a Firestore doc the specs seed and read — fenced exactly the same
      # way (src/lib/google-calendar/provider/mode.ts); the deploy guard
      # refuses these too.
      GCAL_PROVIDER: fake
      GCAL_FAKE_ALLOW_PROD_BUILD: "1"
      GCAL_FAKE_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      # The Reviews AI fake (SP5 PR b) — deterministic sentiment labels, every
      # call logged (ids + count) at private/reviewsAiFakeLog so a spec can
      # count billing — fenced exactly the same way
      # (src/lib/reputation/ai/mode.ts); the deploy guard refuses these too.
      REVIEWS_AI_PROVIDER: fake
      REVIEWS_AI_FAKE_ALLOW_PROD_BUILD: "1"
      REVIEWS_AI_FAKE_AGENCY_ID: ${{ secrets.E2E_AGENCY_ID }}
      # The whole suite runs from one loopback client, so the public booking
      # routes' per-IP rate limiters (src/lib/booking/rate-limit-e2e.ts) would
      # otherwise 429 partway through. Fenced the same way (loopback app URL
      # required); the deploy guard refuses this name too.
      E2E_DISABLE_BOOKING_RATE_LIMITS: "1"
      # The GBP sync cron does nothing unless the schedule is enabled; the E2E
      # specs drive it with a signed POST. (Registering the schedule itself
      # fails harmlessly: the E2E QStash values are not Upstash credentials.)
      GBP_SYNC_SCHEDULE_ENABLED: "1"
      # Signs the OAuth `state`. Per-run, not a stored secret: nothing outlives
      # the job that signs and verifies it.
      AUTOMATIONS_TOKEN_SECRET: e2e-state-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      # No --with-deps: the runner user has no sudo, and the apt step it runs
      # would fail. The shared OS libraries are a host prerequisite.
      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Build
        run: pnpm build

      - name: Playwright
        run: pnpm exec playwright test

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
